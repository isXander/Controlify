name: Release
on: [workflow_dispatch]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - uses: actions/checkout@v7

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read project version
        id: version
        shell: bash
        run: |
          set -o pipefail
          
          ./gradlew --quiet printVersion \
            | grep '^CONTROLIFY_VERSION=' \
            | cut -d= -f2- \
            | sed 's/^/version=/' >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists."
            exit 1
          fi

      - name: Build mod
        run: ./gradlew build --stacktrace

      - uses: actions/attest@v4
        with:
          subject-path: versions/**/build/libs/*.jar

      - name: Publish mod
        run: ./gradlew publishModrinth publishCurseforge announceDiscord publishAllPublicationsToXanderMavenRepository --stacktrace --no-configuration-cache
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ORG_GRADLE_PROJECT_XanderMavenUsername: ${{ secrets.XANDER_MAVEN_USER }}
          ORG_GRADLE_PROJECT_XanderMavenPassword: ${{ secrets.XANDER_MAVEN_PASS }}

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag --annotate "$VERSION" --message "Release $VERSION"
          git push origin "refs/tags/$VERSION"
